<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOCK MONITOR</title>
  <meta name="theme-color" content="#05090b" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="font-34.css" />
  <link rel="stylesheet" href="technical-timeframes.css" />
  <link rel="stylesheet" href="watchlist-no-icons.css" />
  <link rel="stylesheet" href="ticker-search.css" />
  <link rel="stylesheet" href="hero-compact.css" />
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">STOCK <span>MONITOR</span></div>
      <div class="top-actions">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.7-3.7"></path></svg>
          <input id="symbolInput" class="search-input" type="text" autocomplete="off" spellcheck="false" placeholder="SEARCH SYMBOL..." />
        </div>
        <button id="addBtn" class="add-btn" type="button">＋ ADD</button>
      </div>
    </header>

    <section class="layout">
      <aside class="panel watchlist">
        <div class="watch-head"><div class="watch-title">WATCHLIST</div><div id="watchCount" class="watch-count">0</div></div>
        <div class="watch-columns"><div>SYMBOL</div><div>LAST</div><div>CHG</div><div>CHG%</div><div></div></div>
        <div id="watchRows" class="rows"></div>
      </aside>

      <section class="panel detail">
        <div class="hero">
          <div class="company">
            <img id="companyLogo" class="company-logo" alt="" />
            <div>
              <h1 id="ticker" class="ticker">NVDA</h1>
              <div id="companyName" class="company-name">NVIDIA CORPORATION</div>
              <div class="tags"><span id="exchangeTag" class="tag">NASDAQ</span><span id="sectorTag" class="tag">TECHNOLOGY</span><span id="industryTag" class="tag">SEMICONDUCTORS</span></div>
            </div>
          </div>
          <div class="quote">
            <div id="quotePrice" class="quote-price">— <small>USD</small></div>
            <div id="quoteChange" class="quote-change muted">LOADING MARKET DATA...</div>
            <div id="lastUpdate" class="last-update">CHART BY TRADINGVIEW · TECHNICALS CALCULATED BY STOCK MONITOR</div>
          </div>
        </div>

        <div class="chart-card"><div id="ranges" class="ranges"></div><div id="chartHost"></div></div>
        <div id="metrics" class="metrics"></div>

        <div class="bottom-grid">
          <div class="subcard"><div id="techHost"></div></div>
          <div class="subcard performance"><h2>PERFORMANCE</h2><div id="performanceRows"></div></div>
        </div>
      </section>
    </section>

    <div style="margin-top:8px;text-align:right;font-family:Arial,sans-serif;font-size:10px;line-height:1.2;text-transform:none;letter-spacing:0;color:#5f7078;">
      TradingView Lightweight Charts™ Copyright (с) 2025 TradingView, Inc. <a href="https://www.tradingview.com/" target="_blank" rel="noopener noreferrer" style="color:#71848d;text-decoration:none;">TradingView</a>
    </div>
  </main>
  <script src="data-proxy.js?v=20260913-graph2"></script>
  <script src="app.js"></script>
  <script src="crosshair-date-format.js?v=20260913-all-ranges-full-date"></script>
  <script src="custom-chart.js?v=20260913-measure-full-year"></script>
  <script src="five-day-axis.js?v=20260913-1m-reverse-dynamic"></script>
  <script src="chart-range-overrides.js?v=20260913-no-all"></script>
  <script src="measure-position.js"></script>
  <script src="ticker-search.js"></script>
  <script src="crypto-search.js?v=20260913-btcusd-only"></script>
  <script src="bitcoin-only.js?v=20260913-etf-restored"></script>
  <script src="compact-numbers.js?v=20260913-btcusd-marketcap-fix"></script>
  <script src="fundamentals-override.js?v=20260913-btc-cmc-preserve"></script>
  <script src="performance-history.js?v=20260913-cmc-performance"></script>
  <script src="technical-timeframes.js"></script>
  <script src="live-quotes.js?v=20260913-yahoo-unified-btc"></script>
</body>
</html>
