name: TEST LIVE PROXY

on:
  push:
    paths:
      - '.github/workflows/test-live-proxy.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: WAIT FOR VERCEL
        run: sleep 25

      - name: TEST BTC PERFORMANCE
        run: |
          set -e
          curl --fail --show-error --max-time 40 -o /tmp/perf.json "https://stock-monitor-umber.vercel.app/api/crypto-performance?symbol=BTCUSD"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/perf.json'))
          print(json.dumps(d, indent=2))
          assert d.get('source') == 'COINMARKETCAP', d
          v=d.get('values') or {}
          for k in ['day1','day5','month1','month6','ytd','year1','year5','year10','all']:
            assert v.get(k) is not None, (k,d)
          PY
