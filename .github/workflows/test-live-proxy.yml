name: TEST LIVE PROXY

on:
  push:
    paths:
      - '.github/workflows/test-live-proxy.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: TEST CMC RECENT BTC HISTORY
        run: |
          set -e
          END=$(date +%s)
          START=$((END-400*86400))
          curl --fail --show-error --max-time 30 -o /tmp/cmc-history.json "https://api.coinmarketcap.com/data-api/v3/cryptocurrency/historical?id=1&convertId=2781&timeStart=${START}&timeEnd=${END}"
          python - <<'PY'
          import json
          d=json.load(open('/tmp/cmc-history.json'))
          q=(d.get('data') or {}).get('quotes',[])
          print('count:',len(q))
          print('first:',q[0]['timeOpen'] if q else None)
          print('last:',q[-1]['timeClose'] if q else None)
          assert len(q) > 300
          PY
